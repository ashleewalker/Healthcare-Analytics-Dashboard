name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      # npm ci is the reproducible/frozen install. The repository's existing
      # lockfile has an incomplete Vitest dependency graph, so if npm ci leaves
      # a missing transitive module behind, npm install repairs node_modules
      # from the declared package graph before the test step.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
