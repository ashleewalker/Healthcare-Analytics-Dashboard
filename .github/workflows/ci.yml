name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      # Rebuild the lockfile from package.json because the historical lockfile
      # was malformed and omitted Vitest transitive dependencies. This keeps
      # npm ci as the actual installation step used by CI.
      - name: Rebuild lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
