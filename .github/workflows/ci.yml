name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # The committed lockfile currently has an incomplete Vitest tree.
          # npm ci can succeed while leaving Vitest's missing transitive modules
          # absent, so resolve the declared graph before running the test suite.
          npm install --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
